<!DOCTYPE html>
<html lang="en" id="root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Franmyr Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9e4;--surface:#fbf8f5;--ink:#1a0f0b;--mute:#7a6a62;--line:#decfc6;--ember:#ff4d1a;--gold:#ffb020;--on-ember:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0908;--surface:#1b1210;--ink:#fbeee6;--mute:#a38f85;--line:#3a2621}}
:root[data-theme="dark"]{--bg:#0e0908;--surface:#1b1210;--ink:#fbeee6;--mute:#a38f85;--line:#3a2621}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
.row{display:flex;gap:10px}
button{font:600 16px Barlow,system-ui,sans-serif;border-radius:10px;padding:13px 10px;cursor:pointer;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.langs{display:flex;gap:6px}
.langs button{padding:6px 10px;font-size:14px;border-radius:8px}
.langs button[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#fff}
.brand{font:700 22px 'Barlow Condensed',Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border-left:4px solid var(--ember);padding-left:10px}
.stage{position:relative;overflow:hidden;border-radius:14px;padding:20px 16px 18px;text-align:center;color:#fff;border:1px solid #2e1d18;
background:#150d0b}
.lift{font:700 24px 'Barlow Condensed',Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.flame{display:inline-block;animation:flick 1.4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(4deg)}}
.big{font:700 clamp(110px,34vw,150px)/1 'Barlow Condensed',Barlow,sans-serif;margin:4px 0 0;color:#fff}
.big.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:.3}100%{transform:scale(1);opacity:1}}
.of{font-size:15px;font-weight:600;margin:0 0 16px;color:#cdb9ae;letter-spacing:.04em;text-transform:uppercase}
.dots{display:flex;justify-content:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #5a3f36;background:transparent}
.dot.done{background:var(--ember);border-color:var(--ember)}
.dot.now{border-color:#fff;background:transparent}
#rest{text-align:center;font:700 36px 'Barlow Condensed',Barlow,sans-serif;color:var(--ink);min-height:0}
#rest small{display:block;font:400 15px Barlow,sans-serif;color:var(--mute)}
#done{border:0;color:var(--on-ember);font:700 22px 'Barlow Condensed',Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:18px;border-radius:12px;
background:var(--ember);transition:transform .08s,filter .15s}
#done:hover{filter:brightness(1.06)}
#done:active{transform:scale(.97)}
.picker{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.picker h2{font:800 22px 'Barlow Condensed',Barlow,sans-serif;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border-radius:999px;padding:8px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#fff}
.list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.item{text-align:left;display:flex;justify-content:space-between;gap:8px;font-weight:400;background:transparent}
.item span{color:var(--mute);font-size:14px}
.item.on{border-color:var(--ember)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
summary{cursor:pointer;font-weight:600}
details .row{margin-top:12px}
@media (prefers-reduced-motion:reduce){.flame,.big.pop{animation:none}}

<body>
<main>
  <div class="top"><div class="brand">Franmyr Counter</div><div class="langs" id="langs"></div></div>
  <div class="hero" role="img" aria-label="Athlete"><b>Train hard. <i>Count every set.</i></b></div>
  <section class="stage" aria-live="polite">
    <h1 class="lift"><span id="lift"></span></h1>
    <p class="big" id="big"></p>
    <p class="of" id="of"></p>
    <div class="dots" id="dots"></div>
  </section>
  <div id="rest"></div>
  <button id="done"></button>
  <div class="row">
    <button id="undo" style="flex:1" data-i="undo"></button>
    <button id="extra" style="flex:1" data-i="extra"></button>
    <button id="next" style="flex:1" data-i="newex"></button>
  </div>
  <section class="picker" id="picker">
    <h2 data-i="find"></h2>
    <input id="q" type="search" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </section>
  <details>
    <summary data-i="setsrest"></summary>
    <div class="row">
      <label style="flex:1"><span data-i="total"></span><input id="total" type="number" min="1" max="20" inputmode="numeric"></label>
      <label style="flex:1"><span data-i="restsec"></span><input id="restSec" type="number" min="0" max="600" inputmode="numeric"></label>
    </div>
  </details>
</main>
<script>
var I={
undo:['Undo set','Annuler la série','Deshacer serie'],extra:['Add a set','Ajouter une série','Añadir una serie'],
newex:['New exercise','Nouvel exercice','Nuevo ejercicio'],find:['Find an exercise','Trouver un exercice','Buscar un ejercicio'],
ph:['Search squat, curl, plank…','Cherche squat, curl, gainage…','Busca sentadilla, curl, plancha…'],
All:['All','Tout','Todo'],setsrest:['Sets and rest','Séries et repos','Series y descanso'],
total:['Total sets','Nombre de séries','Series totales'],restsec:['Rest (seconds)','Repos (secondes)','Descanso (segundos)'],
pick:['Pick an exercise','Choisis un exercice','Elige un ejercicio'],
of:['Set {a} of {b}','Série {a} sur {b}','Serie {a} de {b}'],
fin:['Crushed it. All {b} sets done','Écrasé ! Les {b} séries sont faites','¡Lo lograste! Las {b} series completadas'],
again:['Go again','Recommencer','Otra vez'],doneN:['Set {a} done','Série {a} terminée','Serie {a} terminada'],
restthen:['Rest, then set {a}','Repos, puis série {a}','Descanso, luego serie {a}'],
none:['Nothing found. Type a name to add your own.','Rien trouvé. Tape un nom pour ajouter le tien.','Sin resultados. Escribe un nombre para añadir el tuyo.'],
use:['Use “{a}”','Utiliser « {a} »','Usar «{a}»'],custom:['Custom','Personnalisé','Personalizado'],
Chest:['Chest','Poitrine','Pecho'],Back:['Back','Dos','Espalda'],Legs:['Legs','Jambes','Piernas'],Shoulders:['Shoulders','Épaules','Hombros'],
Arms:['Arms','Bras','Brazos'],Core:['Core','Abdos','Abdomen'],Cardio:['Cardio','Cardio','Cardio']};
var RAW={
Chest:'Bench press|Développé couché|Press de banca;Incline dumbbell press|Développé incliné haltères|Press inclinado con mancuernas;Push-up|Pompes|Flexiones;Chest fly|Écarté poitrine|Aperturas;Cable crossover|Poulie vis-à-vis|Cruce de poleas;Dips|Dips|Fondos;Decline bench press|Développé décliné|Press declinado;Machine chest press|Presse pectorale machine|Press de pecho en máquina',
Back:'Pull-up|Traction|Dominadas;Chin-up|Traction supination|Dominadas supinas;Lat pulldown|Tirage vertical|Jalón al pecho;Barbell row|Rowing barre|Remo con barra;Dumbbell row|Rowing haltère|Remo con mancuerna;Seated cable row|Tirage horizontal|Remo en polea baja;Deadlift|Soulevé de terre|Peso muerto;Face pull|Face pull|Face pull;T-bar row|Rowing barre en T|Remo en barra T',
Legs:'Back squat|Squat arrière|Sentadilla trasera;Front squat|Squat avant|Sentadilla frontal;Goblet squat|Squat goblet|Sentadilla goblet;Leg press|Presse à cuisses|Prensa de piernas;Romanian deadlift|Soulevé de terre roumain|Peso muerto rumano;Walking lunge|Fentes marchées|Zancadas caminando;Bulgarian split squat|Squat bulgare|Sentadilla búlgara;Leg curl|Leg curl|Curl femoral;Leg extension|Extension des jambes|Extensión de piernas;Calf raise|Mollets debout|Elevación de talones;Hip thrust|Hip thrust|Hip thrust',
Shoulders:'Overhead press|Développé militaire|Press militar;Lateral raise|Élévations latérales|Elevaciones laterales;Front raise|Élévations frontales|Elevaciones frontales;Rear delt fly|Oiseau|Pájaros;Arnold press|Développé Arnold|Press Arnold;Upright row|Tirage menton|Remo al mentón;Shrug|Shrug|Encogimientos',
Arms:'Barbell curl|Curl barre|Curl con barra;Hammer curl|Curl marteau|Curl martillo;Preacher curl|Curl pupitre|Curl predicador;Triceps pushdown|Extension triceps poulie|Extensión de tríceps en polea;Skull crusher|Barre au front|Press francés;Overhead triceps extension|Extension triceps au-dessus de la tête|Extensión de tríceps sobre la cabeza;Close-grip bench press|Développé couché prise serrée|Press cerrado',
Core:'Plank|Gainage|Plancha;Crunch|Crunch|Abdominales;Hanging leg raise|Relevé de jambes suspendu|Elevación de piernas colgado;Russian twist|Rotation russe|Giro ruso;Ab wheel rollout|Roue abdominale|Rueda abdominal;Cable crunch|Crunch à la poulie|Crunch en polea;Mountain climber|Mountain climber|Escaladores;Dead bug|Dead bug|Dead bug',
Cardio:'Burpee|Burpee|Burpee;Jump rope|Corde à sauter|Saltar la cuerda;Rowing machine|Rameur|Máquina de remo;Treadmill run|Course sur tapis|Correr en cinta;Kettlebell swing|Swing kettlebell|Swing con kettlebell;Box jump|Saut sur box|Salto al cajón;Battle ropes|Cordes ondulatoires|Cuerdas de batalla;Assault bike|Assault bike|Assault bike'};
var CATS=Object.keys(RAW),ALL=[],DISP={};
CATS.forEach(function(c){RAW[c].split(';').forEach(function(r){var p=r.split('|');ALL.push({n:p[0],c:c});DISP[p[0]]=p;});});
var LANGS=['en','fr','es'],KEY='set-counter-v2',cat='All';
var s={name:'Bench press',total:3,rest:90,done:0,restEnd:0,lang:null};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p.total==='number')s=Object.assign(s,p);}}catch(e){}
if(LANGS.indexOf(s.lang)<0){var nl=((navigator.language||'en')+'').slice(0,2);s.lang=LANGS.indexOf(nl)>-1?nl:'en';}
var $=function(id){return document.getElementById(id)};
function L(){return LANGS.indexOf(s.lang)}
function t(k,v){var x=I[k][L()];return v?x.replace('{a}',v.a).replace('{b}',v.b):x;}
function dn(n){return DISP[n]?DISP[n][L()]:n;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
function esc(x){return x.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function render(pop){
  var fin=s.done>=s.total;
  document.documentElement.lang=s.lang;
  document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i);});
  $('q').placeholder=t('ph');
  $('langs').innerHTML=LANGS.map(function(l){return '<button data-l="'+l+'" aria-pressed="'+(l===s.lang)+'">'+l.toUpperCase()+'</button>';}).join('');
  $('lift').textContent=s.name?dn(s.name):t('pick');
  $('big').textContent=fin?'✓':s.done+1;
  $('big').className='big';
  if(pop){void $('big').offsetWidth;$('big').className='big pop';}
  $('of').textContent=fin?t('fin',{b:s.total}):t('of',{a:s.done+1,b:s.total});
  var d='';for(var i=0;i<s.total;i++)d+='<span class="dot'+(i<s.done?' done':(i===s.done&&!fin?' now':''))+'"></span>';
  $('dots').innerHTML=d;
  $('done').textContent=fin?t('again'):t('doneN',{a:s.done+1});
  $('total').value=s.total;$('restSec').value=s.rest;
  renderChips();tick();renderList();
}
function tick(){
  var left=Math.ceil((s.restEnd-Date.now())/1000);
  if(left>0&&s.done<s.total){var m=Math.floor(left/60),x=left%60;
    $('rest').innerHTML=m+':'+(x<10?'0':'')+x+'<small>'+esc(t('restthen',{a:s.done+1}))+'</small>';}
  else $('rest').innerHTML='';
}
setInterval(tick,250);
function renderChips(){
  $('chips').innerHTML=['All'].concat(CATS).map(function(c){
    return '<button class="chip" data-c="'+c+'" aria-pressed="'+(c===cat)+'">'+esc(t(c))+'</button>';}).join('');
}
function renderList(){
  var raw=$('q').value.trim(),q=raw.toLowerCase();
  var res=ALL.filter(function(e){return (cat==='All'||e.c===cat)&&(!q||e.n.toLowerCase().indexOf(q)>-1||dn(e.n).toLowerCase().indexOf(q)>-1||t(e.c).toLowerCase().indexOf(q)>-1);});
  var h=res.map(function(e){return '<button class="item'+(e.n===s.name?' on':'')+'" data-n="'+esc(e.n)+'">'+esc(dn(e.n))+'<span>'+esc(t(e.c))+'</span></button>';}).join('');
  var exact=ALL.some(function(e){return e.n.toLowerCase()===q||dn(e.n).toLowerCase()===q;});
  if(raw&&!exact)h+='<button class="item" data-n="'+esc(raw)+'">'+esc(t('use',{a:raw}))+'<span>'+esc(t('custom'))+'</span></button>';
  if(!h)h='<p style="color:var(--mute);margin:0">'+esc(t('none'))+'</p>';
  $('list').innerHTML=h;
}
$('langs').onclick=function(e){var b=e.target.closest('[data-l]');if(b){s.lang=b.dataset.l;save();render();}};
$('chips').onclick=function(e){var c=e.target.closest('.chip');if(c){cat=c.dataset.c;renderChips();renderList();}};
$('list').onclick=function(e){var b=e.target.closest('.item');if(!b)return;
  s.name=b.dataset.n;s.done=0;s.restEnd=0;save();render(true);window.scrollTo({top:0,behavior:'smooth'});};
$('q').oninput=renderList;
$('done').onclick=function(){
  if(s.done>=s.total){s.done=0;s.restEnd=0;}
  else{s.done++;s.restEnd=(s.done<s.total&&s.rest>0)?Date.now()+s.rest*1000:0;try{if(navigator.vibrate)navigator.vibrate(40);}catch(e){}}
  save();render(true);
};
$('undo').onclick=function(){if(s.done>0){s.done--;s.restEnd=0;save();render(true);}};
$('extra').onclick=function(){s.total=Math.min(20,s.total+1);save();render();};
$('next').onclick=function(){$('picker').scrollIntoView({behavior:'smooth'});$('q').focus({preventScroll:true});};
$('total').onchange=function(){var v=parseInt(this.value,10);if(v>=1&&v<=20){s.total=v;if(s.done>v)s.done=v;}save();render();};
$('restSec').onchange=function(){var v=parseInt(this.value,10);s.rest=(v>=0&&v<=600)?v:90;save();render();};
render();
</script>
</body>
</html>
